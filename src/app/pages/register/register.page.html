<ion-content [fullscreen]="true" class="[--background:var(--bg)]">
  <div class="min-h-full bg-[var(--bg)] px-6 pb-10 pt-[max(2.5rem,env(safe-area-inset-top))] font-sans text-[var(--fg)]">
    <app-bg-shadows />
    <header class="flex justify-between border-t-[6px] border-[var(--fg)] pt-2 text-[11px] font-bold uppercase tracking-[0.2em]">
      <span>Movie Match</span>
      <span>02 / 02</span>
    </header>

    <h1 class="mt-8 text-[3.5rem] font-black uppercase leading-[0.8] tracking-tighter">
      Inscription<span class="text-[var(--accent)]">.</span>
    </h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="mt-10 space-y-7">

      <!-- Photo -->
      <div class="flex items-end gap-4">
        <button
          type="button"
          (click)="takePhoto()"
          class="relative size-32 shrink-0 overflow-hidden border-4 bg-[var(--fg)]/10"
          [class]="photoMissing() ? 'border-[var(--accent)]' : 'border-[var(--fg)]'"
        >
          @if (photo()) {
            <img [src]="photo()" alt="Ma photo" class="size-full object-cover" />
          } @else {
            <div class="absolute -right-4 bottom-3 size-16 rounded-full bg-[var(--accent)]"></div>
            <div class="absolute bottom-0 left-0 size-8 bg-[var(--fg)]"></div>
          }
        </button>
        <div>
          <button type="button" (click)="takePhoto()"
            class="text-xs font-black uppercase tracking-[0.2em] underline decoration-2 underline-offset-4">
            {{ photo() ? 'Reprendre' : 'Prendre une photo' }}
          </button>
          @if (photoMissing()) {
            <p class="mt-2 text-[11px] font-bold uppercase tracking-widest text-[var(--accent)]">Photo obligatoire</p>
          }
        </div>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <label class="block">
          <span class="text-[11px] font-bold uppercase tracking-[0.2em]">Prénom</span>
          <input type="text" formControlName="firstName" autocomplete="given-name"
            class="mt-1 w-full border-0 border-b-4 bg-transparent py-2 text-lg font-black tracking-tight text-[var(--fg)] focus:border-[var(--accent)] focus:outline-none"
            [class]="invalid('firstName') ? 'border-[var(--accent)]' : 'border-[var(--fg)]'" />
        </label>
        <label class="block">
          <span class="text-[11px] font-bold uppercase tracking-[0.2em]">Nom</span>
          <input type="text" formControlName="lastName" autocomplete="family-name"
            class="mt-1 w-full border-0 border-b-4 bg-transparent py-2 text-lg font-black tracking-tight text-[var(--fg)] focus:border-[var(--accent)] focus:outline-none"
            [class]="invalid('lastName') ? 'border-[var(--accent)]' : 'border-[var(--fg)]'" />
        </label>
      </div>

      <label class="block">
        <span class="text-[11px] font-bold uppercase tracking-[0.2em]">Âge</span>
        <input type="number" formControlName="age" inputmode="numeric"
          class="mt-1 w-full border-0 border-b-4 bg-transparent py-2 text-lg font-black tracking-tight text-[var(--fg)] focus:border-[var(--accent)] focus:outline-none"
          [class]="invalid('age') ? 'border-[var(--accent)]' : 'border-[var(--fg)]'" />
        @if (invalid('age')) {
          <span class="mt-1 block text-[11px] font-bold uppercase tracking-widest text-[var(--accent)]">Âge entre 10 et 120</span>
        }
      </label>

      <label class="block">
        <span class="text-[11px] font-bold uppercase tracking-[0.2em]">Email</span>
        <input type="email" formControlName="email" autocomplete="email"
          class="mt-1 w-full border-0 border-b-4 bg-transparent py-2 text-lg font-black tracking-tight text-[var(--fg)] focus:border-[var(--accent)] focus:outline-none"
          [class]="invalid('email') ? 'border-[var(--accent)]' : 'border-[var(--fg)]'" />
        @if (invalid('email')) {
          <span class="mt-1 block text-[11px] font-bold uppercase tracking-widest text-[var(--accent)]">Email invalide</span>
        }
      </label>

      <label class="block">
        <span class="text-[11px] font-bold uppercase tracking-[0.2em]">Mot de passe</span>
        <input type="password" formControlName="password" autocomplete="new-password"
          class="mt-1 w-full border-0 border-b-4 bg-transparent py-2 text-lg font-black tracking-tight text-[var(--fg)] focus:border-[var(--accent)] focus:outline-none"
          [class]="invalid('password') ? 'border-[var(--accent)]' : 'border-[var(--fg)]'" />
        @if (invalid('password')) {
          <span class="mt-1 block text-[11px] font-bold uppercase tracking-widest text-[var(--accent)]">6 caractères minimum</span>
        }
      </label>

      @if (error()) {
        <p class="border-l-4 border-[var(--accent)] pl-3 text-xs font-bold uppercase tracking-widest text-[var(--accent)]">
          {{ error() }}
        </p>
      }

      <button type="submit" [disabled]="busy()"
        class="w-full bg-[var(--accent)] py-4 text-sm font-black uppercase tracking-[0.2em] text-white disabled:opacity-50">
        {{ busy() ? 'Création…' : 'Créer mon compte' }}
      </button>
    </form>
<input id="photoInput" type="file" accept="image/*" capture="user" class="hidden" (change)="onFileChosen($event)" />
    <p class="mt-10 border-t-2 border-[var(--fg)] pt-4 text-xs font-bold uppercase tracking-widest">
      Déjà inscrit ?
      <a routerLink="/login" class="ml-1 text-[var(--accent)] underline decoration-2 underline-offset-4">Se connecter</a>
    </p>
  </div>
</ion-content>
